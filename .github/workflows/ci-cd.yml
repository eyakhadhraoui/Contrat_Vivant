name: CI/CD Pipeline - Agent Assurance Multi-Agents

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
      - master

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: ${{ github.repository }}/backend
  FRONTEND_IMAGE_NAME: ${{ github.repository }}/frontend

jobs:
  # ==============================================================
  # 1. Tests & Validation du Backend Python
  # ==============================================================
  test-backend:
    name: 🐍 Test Backend (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout du code source
        uses: actions/checkout@v4

      - name: ⚙️ Configuration de Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Installation de Tesseract OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-fra

      - name: 📦 Installation des dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧪 Exécution des tests unitaires et règles métier
        env:
          TESTING: '1'
        run: |
          python -m unittest discover tests

  # ==============================================================
  # 2. Build & Validation du Frontend React
  # ==============================================================
  test-frontend:
    name: ⚛️ Test & Build Frontend (React + Vite)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: 📥 Checkout du code source
        uses: actions/checkout@v4

      - name: ⚙️ Configuration de Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: 📦 Installation des dépendances npm
        run: npm ci || npm install

      - name: 🏗️ Construction du bundle de production
        run: npm run build

  # ==============================================================
  # 3. Construction et Publication des Images Docker
  # ==============================================================
  build-and-push-docker:
    name: 🐳 Build & Push Docker Images
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout du code source
        uses: actions/checkout@v4

      - name: ⚙️ Configuration de Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Connexion au GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- Image Backend ---
      - name: 🏷️ Extraction des métadonnées Docker (Backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag

      - name: 🔨 Construction & Push Image Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Image Frontend ---
      - name: 🏷️ Extraction des métadonnées Docker (Frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag

      - name: 🔨 Construction & Push Image Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==============================================================
  # 4. Déploiement Continu Automatisé (Optionnel / Serveur SSH)
  # ==============================================================
  deploy:
    name: 🚀 Déploiement en Production
    needs: [build-and-push-docker]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && false # Activer en configurant les secrets SSH

    steps:
      - name: 📥 Checkout pour récupérer docker-compose.yml
        uses: actions/checkout@v4

      - name: 🌐 Déploiement à distance via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          script: |
            cd /opt/agent-assurance
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -af
