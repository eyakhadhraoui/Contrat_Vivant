services:
  # -------------------------------------------------------------
  # Base de données MySQL
  # -------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: assurance-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-assurance_db}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    networks:
      - assurance-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # -------------------------------------------------------------
  # Backend FastAPI + AI Multi-Agents
  # -------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: assurance-backend
    restart: unless-stopped
    environment:
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=${MYSQL_DATABASE:-assurance_db}
      - MYSQL_USER=${MYSQL_USER:-root}
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD:-rootpassword}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - COMINTY_API_KEY=${COMINTY_API_KEY:-}
      - COMINTY_USER_ID=${COMINTY_USER_ID:-}
      - COMINTY_AGENT_EXTRACTION_ID=${COMINTY_AGENT_EXTRACTION_ID:-}
      - COMINTY_AGENT_ANOMALIES_ID=${COMINTY_AGENT_ANOMALIES_ID:-}
      - COMINTY_AGENT_RISK_ID=${COMINTY_AGENT_RISK_ID:-}
      - COMINTY_AGENT_REPORT_ID=${COMINTY_AGENT_REPORT_ID:-}
      - EMAIL_SENDER=${EMAIL_SENDER:-}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD:-}
      - JWT_SECRET=${JWT_SECRET:-secret_assurance_key_2026}
      - TESTING=0
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./docker/entrypoint.sh:/app/docker/entrypoint.sh:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - assurance-network

  # -------------------------------------------------------------
  # Frontend React (Nginx Reverse Proxy)
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: assurance-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - assurance-network

  # -------------------------------------------------------------
  # Monitoring Prometheus
  # -------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: assurance-prometheus
    restart: unless-stopped
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - backend
    networks:
      - assurance-network

networks:
  assurance-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  prometheus_data:
    driver: local
