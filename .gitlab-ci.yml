# ==============================================================
# Pipeline GitLab CI/CD - Agent Assurance Multi-Agents
# ==============================================================

stages:
  - test
  - build
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  BACKEND_IMAGE: $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA
  BACKEND_IMAGE_LATEST: $CI_REGISTRY_IMAGE/backend:latest
  FRONTEND_IMAGE: $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA
  FRONTEND_IMAGE_LATEST: $CI_REGISTRY_IMAGE/frontend:latest

# -------------------------------------------------------------
# 1. Tests Backend
# -------------------------------------------------------------
test_backend:
  stage: test
  image: python:3.12-slim
  before_script:
    - apt-get update && apt-get install -y tesseract-ocr tesseract-ocr-fra
    - pip install --upgrade pip
    - pip install -r requirements.txt
  script:
    - export TESTING=1
    - python -m unittest discover tests

# -------------------------------------------------------------
# 2. Tests & Build Frontend
# -------------------------------------------------------------
test_frontend:
  stage: test
  image: node:20-alpine
  before_script:
    - cd frontend
    - npm ci || npm install
  script:
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 hour

# -------------------------------------------------------------
# 3. Build & Push Images Docker
# -------------------------------------------------------------
build_backend_image:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $BACKEND_IMAGE -t $BACKEND_IMAGE_LATEST -f Dockerfile .
    - docker push $BACKEND_IMAGE
    - docker push $BACKEND_IMAGE_LATEST
  only:
    - main
    - master

build_frontend_image:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $FRONTEND_IMAGE -t $FRONTEND_IMAGE_LATEST -f frontend/Dockerfile ./frontend
    - docker push $FRONTEND_IMAGE
    - docker push $FRONTEND_IMAGE_LATEST
  only:
    - main
    - master

# -------------------------------------------------------------
# 4. Déploiement (Production)
# -------------------------------------------------------------
deploy_production:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$PROD_SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
  script:
    - ssh -o StrictHostKeyChecking=no $PROD_SERVER_USER@$PROD_SERVER_HOST "cd /opt/agent-assurance && docker compose pull && docker compose up -d && docker image prune -af"
  only:
    - main
    - master
  when: manual
